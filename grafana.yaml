ingress:
    enabled: true
    annotations:
      kubernetes.io/ingressClassName: nginx
      kubernetes.io/tls-acme: "true"
    hosts:
      - grafana.local
    path: /

# Use an existing secret for the admin user.
admin:
  ## Name of the secret. Can be templated.
  existingSecret: "grafana-creds"
  userKey: admin-user
  passwordKey: admin-password

persistence:
  enabled: true