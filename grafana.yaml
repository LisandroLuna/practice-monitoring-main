ingress:
    enabled: true
    annotations:
      kubernetes.io/ingressClassName: nginx
      kubernetes.io/tls-acme: "true"
    hosts:
      - grafana.local
    path: /

# Use an existing secret for the admin user.
admin:
  ## Name of the secret. Can be templated.
  existingSecret: "grafana-creds"
  userKey: admin-user
  passwordKey: admin-password

adminUser: admin
adminPassword: "zaq12wsx"

# # Use an existing secret for the admin user.
# admin:
#   ## Name of the secret. Can be templated.
#   existingSecret: ""
#   userKey: admin-user
#   passwordKey: admin-password

persistence:
  enabled: true
  size: 10Gi
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: InfluxDB
        type: influxdb
        url: http://influxdb.monitoring:8086
        username: "admin"
        password: "zaq12wsx"
        database: influxdb
        access: proxy
        jsonData:
          httpMode: GET
        uid: influxdb  # Specify the UID for the datasource